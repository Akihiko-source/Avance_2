server {
  listen 8080;

  location = /health { return 200 'ok'; add_header Content-Type text/plain; }

  location /api/catalogo/ { proxy_pass http://catalogo:3000/; }
  location /api/carrito/  { proxy_pass http://carrito:3001/; }
  location /api/ordenes/  { proxy_pass http://ordenes:3002/; }
  location /api/pagos/    { proxy_pass http://pagos:3003/; }

  # Interfaz web
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
